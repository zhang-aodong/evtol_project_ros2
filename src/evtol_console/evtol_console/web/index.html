<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EVTOL 仿真控制台</title><style>html,body,#app{height:100%;margin:0}</style></head><body><div id="app"></div><script type="module">
import {mountConsole} from './app.js';
